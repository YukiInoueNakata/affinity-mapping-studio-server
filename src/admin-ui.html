<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Affinity Mapping Studio Server — 管理</title>
  <link rel="stylesheet" href="/admin/admin-ui.css" />
</head>
<body>
  <header>
    <h1>Affinity Mapping Studio Server — 管理</h1>
    <button id="newRoomBtn" class="primary">+ ルームを追加</button>
    <button id="refreshBtn">更新</button>
    <button id="logoutBtn">ログアウト</button>
    <div class="meta" id="serverMeta"></div>
  </header>

  <!-- B2 (2026-06-09): URL Dashboard (R14 推奨 default 開) -->
  <details class="kj-section" id="urlDashboard" open>
    <summary>
      <span class="kj-section-title">サーバー URL</span>
      <span class="kj-section-meta" id="urlDashboardMeta"></span>
    </summary>
    <div class="kj-section-body" id="urlDashboardBody">
      <div class="muted">読み込み中…</div>
    </div>
  </details>

  <!-- B5' (2026-06-09): Auth Policy (シナリオ + Advanced matrix) -->
  <details class="kj-section" id="authPolicySection" open>
    <summary>
      <span class="kj-section-title">認証ポリシー (シナリオ)</span>
      <span class="kj-section-meta" id="authPolicyMeta"></span>
    </summary>
    <div class="kj-section-body" id="authPolicyBody">
      <div class="muted">読み込み中…</div>
    </div>
  </details>

  <div class="layout">
    <aside>
      <div class="rooms-section">
        <h2>ルーム</h2>
        <div id="roomList"></div>
      </div>
      <div class="presence-section">
        <h2>接続中 <span id="presenceCount" style="text-transform: none;"></span></h2>
        <div class="presence-meta" id="presenceUpdated"></div>
        <div id="presenceList"></div>
      </div>
      <div class="presence-section" id="serverConfigSection">
        <h2>公開方式</h2>
        <div id="serverConfigPanel" style="font-size: 12px;">読み込み中...</div>
      </div>
    </aside>
    <main>
      <div id="errorBar" style="display: none;" class="err"></div>
      <div id="detail">
        <div class="empty">左のリストからルームを選択してください．</div>
      </div>
    </main>
  </div>

  <script src="/admin/admin-ui.js"></script>
</body>
</html>
